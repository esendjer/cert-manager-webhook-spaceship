[project]
name = "cert-manager-webhook-spaceship"
authors = [
  {name = "esendjer", email = "esendjer@gmail.com"},
]
readme = "README.md"
version = "0.1"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "httpx2>=2.16.2",
    "pydantic>=2.14.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
